[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-scaling-from-scratch"
version = "0.1.0"
description = "From-scratch GPT-style transformer used to test Kaplan-style parameter scaling on arXiv abstracts"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "numpy==2.2.1",
    "scipy==1.14.1",
    "matplotlib==3.10.0",
    "tokenizers==0.21.0",
    "pyarrow==18.1.0",
    "huggingface_hub==0.27.0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
